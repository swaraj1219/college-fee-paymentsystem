<!DOCTYPE html>
<html>
<head>
    <title>College Fee Payment</title>
</head>
<body>

<h2>Fee Payment Form</h2>

<form action="FeeServlet" method="post" enctype="multipart/form-data">

Student ID: <input type="text" name="id"><br><br>
Name: <input type="text" name="name"><br><br>
Email: <input type="text" name="email"><br><br>
Phone: <input type="text" name="phone"><br><br>

Total Fee: <input type="text" name="total"><br><br>
Paid Amount: <input type="text" name="paid"><br><br>

Bank Name: <input type="text" name="bank"><br><br>
Payment Date: <input type="text" name="date"><br><br>

Last Date: <input type="text" name="lastdate"><br><br>

Upload Photo: <input type="file" name="photo"><br><br>

<input type="submit" value="Pay Fee">

</form>

</body>
</html>
